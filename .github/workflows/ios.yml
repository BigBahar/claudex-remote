name: iOS remote

# Builds Claudex Remote for iPhone (ios/, native SwiftUI) on a macOS runner, unsigned: Silo Store (Uri's SideStore)
# re-signs it on the phone with a free Apple ID. Runs only when asked; this repository is public, so macOS
# runners are free. Writes the IPA, and checks that the app launches on the simulator.
#
# If the Actions artifact storage is full (it was, once), the build is pushed to a short-lived branch instead.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Builds 1.1 to 1.10 came from the private Claudex repository; this one continues after them.
      - name: Pick the version
        run: echo "CODE=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen >/dev/null
          xcodebuild -version
          xcodegen generate

      - name: Build for iPhone, unsigned
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project ClaudexRemote.xcodeproj -scheme ClaudexRemote -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CLAUDEX_VERSION_CODE=$CODE \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | grep -E "error:|warning: .*Sources/|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/ClaudexRemote.app || { echo "::error::the app did not build"; exit 1; }

      - name: Wrap it as an IPA
        working-directory: ios
        run: |
          mkdir -p out Payload
          cp -R build/Build/Products/Release-iphoneos/ClaudexRemote.app Payload/
          zip -qry out/claudex-remote.ipa Payload
          cp Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png out/claudex-remote-icon.png
          echo "{\"code\": $CODE, \"name\": \"1.$CODE\"}" > out/ios.json
          ls -l out

      - uses: actions/upload-artifact@v4
        id: ipa
        continue-on-error: true
        with:
          name: claudex-remote-ipa
          path: ios/out/*
          retention-days: 3
          if-no-files-found: error

      - name: Save the build on a branch instead
        if: ${{ steps.ipa.outcome == 'failure' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ios/out/*
          git commit -m "iOS build $CODE"
          git push origin "HEAD:refs/heads/ios-build-${{ github.run_id }}"

      - name: Launch on the simulator
        working-directory: ios
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in d if "iOS" in k for x in d[k] if x["name"].startswith("iPhone 16")))')
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcodebuild -project ClaudexRemote.xcodeproj -scheme ClaudexRemote -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEV" -derivedDataPath simbuild CLAUDEX_VERSION_CODE=$CODE \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build -quiet
          xcrun simctl install "$DEV" simbuild/Build/Products/Debug-iphonesimulator/ClaudexRemote.app
          mkdir -p shots
          xcrun simctl launch "$DEV" com.silolabs.claudex
          sleep 6
          xcrun simctl io "$DEV" screenshot shots/pair.png
          # Still running after six seconds means it did not crash on launch.
          xcrun simctl spawn "$DEV" launchctl list | grep -q com.silolabs.claudex || { echo "::error::the app is not running"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: simulator-shots
          path: ios/shots/*
          retention-days: 3
          if-no-files-found: ignore
